<!-- <app-toast-message [successToast]="successToast" [errorToast]="errorToast" [toastMsg]="toastMsg"></app-toast-message> -->

<div class="bd-tab-content-ss card shadow border-transparent">
    <div class="bd-tab-content">
        <div class="d-flex justify-content-center align-items-center adani-logo">
            <img src="../../../assets/svg/Adani-logo-1.svg" alt="" />
        </div>
        <!-- <div class="tabs">
            <div class="tab" [class.active]="activeTab === 'tab1'" (click)="changeTab('tab1')">Employee</div>
        </div> -->

        <div class="bd-tab-content">
            <div *ngIf="activeTab === 'tab1'">
                <div class="login-panel">
                    <div class="login-section">

                        <form *ngIf="formType=='login'" [formGroup]="siteLoginForm" name="siteLoginForm">

                            <div class="py-2 text-start">
                                <label for="username" class="form-label">Email or Mobile Number</label>
                                <input type="email" class="form-control" id="username" placeholder="Enter your Email or Mobile Number"
                                    formControlName="username" maxLength="51" minlength="4">


                                <span *ngIf="siteLoginForm.get('username').hasError('maxlength')" class="error-message">
                                    username exceeds max 50 characters
                                </span>
                            </div>
                            <div class="py-2">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="*********"
                                    formControlName="password" maxLength="50">
                            </div>
                            <div class="d-grid gap-2">
                                <button *ngIf="!isLoader" class="login-button" type="submit"
                                    [disabled]="siteLoginForm.invalid" (click)="login($event)">Login</button>

                                <button *ngIf="isLoader" class="login-button" type="button" disabled>
                                    <span class="spinner-border spinner-border-sm" role="status"
                                        aria-hidden="true"></span>
                                    Loading...
                                </button>
                            </div>
                            <p class="text-center">Don't have an Account?<a href="javascript:void(0)" (click)="formType='register'">Register Now</a></p>

                        </form>

                        <form *ngIf="formType=='register'" [formGroup]="registerForm" name="registerForm">
                            <div class="py-2 text-start">
                                <label for="firstname" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstname" placeholder="Enter firstname"
                                    formControlName="firstname" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="lastname" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastname" placeholder="Enter lastname"
                                    formControlName="lastname" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter email"
                                    formControlName="email" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="mobile" class="form-label">Mobile</label>
                                <input type="text" class="form-control" id="mobile" placeholder="Enter Mobile"
                                    formControlName="mobile" maxLength="10" minlength="10">
                            </div>

                            <div class="py-2 text-start">
                                <label for="regPassword" class="form-label">Password</label>
                                <input type="text" class="form-control" id="regPassword" placeholder="Enter password"
                                    formControlName="regPassword" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2">
                                <label for="role" class="form-label">Role</label>
                                <!-- <input type="password" class="form-control" id="role"
                                    formControlName="role" maxLength="50"> -->
                                <select formControlName="role" class="form-control">
                                    <option value="0">---------------------------------------Select Role-------------------------------------</option>
                                    <option value="1">Admin</option>
                                    <option value="2">User</option>
                                    <option value="3">Manager</option>    
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="login-button" type="submit" (click)="register($event)">Regsiter</button>                                
                            </div>
                            <p class="text-center">Already have account <a href="javascript:void(0)" (click)="formType='login'">Login</a></p>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
