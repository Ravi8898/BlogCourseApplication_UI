<!-- <app-toast-message [successToast]="successToast" [errorToast]="errorToast" [toastMsg]="toastMsg"></app-toast-message> -->

<div class="bd-tab-content-ss card shadow border-transparent">
    <div class="bd-tab-content">
        <div class="d-flex justify-content-center align-items-center adani-logo">
            <img src="../../../assets/svg/Adani-logo-1.svg" alt="" />
        </div>
        <!-- <div class="tabs">
            <div class="tab" [class.active]="activeTab === 'tab1'" (click)="changeTab('tab1')">Employee</div>
        </div> -->

        <div class="bd-tab-content">
            <div *ngIf="activeTab === 'tab1'">
                <div class="login-panel">
                    <div class="login-section">

                        <form *ngIf="formType=='login'" [formGroup]="siteLoginForm" name="siteLoginForm">

                            <div class="py-2 text-start">
                                <label for="username" class="form-label">Email or Mobile Number</label>
                                <input type="email" class="form-control" id="username" placeholder="Enter your Email or Mobile Number"
                                    formControlName="username" maxLength="51" minlength="4">


                                <span *ngIf="siteLoginForm.get('username').hasError('maxlength')" class="error-message">
                                    username exceeds max 50 characters
                                </span>
                            </div>
                            <div class="py-2">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="*********"
                                    formControlName="password" maxLength="50">
                            </div>
                            <div class="d-grid gap-2">
                                <button *ngIf="!isLoader" class="login-button" type="submit"
                                    [disabled]="siteLoginForm.invalid" (click)="login($event)">Login</button>

                                <button *ngIf="isLoader" class="login-button" type="button" disabled>
                                    <span class="spinner-border spinner-border-sm" role="status"
                                        aria-hidden="true"></span>
                                    Loading...
                                </button>
                            </div>
                            <p class="text-center">Don't have an Account?<a href="javascript:void(0)" (click)="formType='register'">Register Now</a></p>

                        </form>

                        <form *ngIf="formType=='register'" [formGroup]="registerForm" name="registerForm">
                            <div class="py-2 text-start">
                                <label for="firstname" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstname" placeholder="Enter first name"
                                    formControlName="firstname" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="lastname" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastname" placeholder="Enter last name"
                                    formControlName="lastname" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter email"
                                    formControlName="email" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="mobile" class="form-label">Mobile</label>
                                <input type="text" class="form-control" id="mobile" placeholder="Enter Mobile Number"
                                    formControlName="mobile" maxLength="10" minlength="10">
                            </div>

                            <div class="py-2 text-start">
                                <label for="regPassword" class="form-label">Password</label>
                                <input type="text" class="form-control" id="regPassword" placeholder="Enter password"
                                    formControlName="regPassword" maxLength="51" minlength="4">
                            </div>

                            <div class="py-2 text-start">
                                <label for="addressLine1" class="form-label">Address Line 1</label>
                                <input type="text" class="form-control" id="addressLine1" placeholder="Enter address line 1"
                                    formControlName="addressLine1" maxLength="51" minlength="10">
                            </div>
                            <div class="py-2 text-start">
                                <label for="addressLine2" class="form-label">Address Line 2</label>
                                <input type="text" class="form-control" id="addressLine2" placeholder="Enter address line 2"
                                    formControlName="addressLine2" maxLength="51" minlength="10">
                            </div>
                            
                            <div class="py-2 text-start">
                                <label for="landmark" class="form-label">Landmark</label>
                                <input type="text" class="form-control" id="landmark" placeholder="Enter landmark"
                                    formControlName="landmark" maxLength="51" minlength="4">
                            </div>
                            <div class="py-2 text-start">
                                <label for="district" class="form-label">District</label>
                                <input type="text" class="form-control" id="district" placeholder="Enter district"
                                    formControlName="district" maxLength="51" minlength="4">
                            </div>
                            <div class="py-2 text-start">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" placeholder="Enter city"
                                    formControlName="city" maxLength="51" minlength="4">
                            </div>
                            <div class="py-2 text-start">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" placeholder="Enter state"
                                    formControlName="state" maxLength="51" minlength="4">
                            </div>
                            <div class="py-2 text-start">
                                <label for="country" class="form-label">Country</label>
                                <input type="text" class="form-control" id="country" placeholder="Enter country"
                                    formControlName="country" maxLength="51" minlength="4">
                            </div>
                            <div class="py-2 text-start">
                                <label for="postalCode" class="form-label">Postal Code</label>
                                <input type="text" class="form-control" id="postalCode" placeholder="Enter postal code"
                                    formControlName="postalCode" maxLength="6" minlength="6">
                            </div>

                            <div class="d-grid gap-2">
                                <button class="login-button" type="submit" (click)="register($event)">Regsiter</button>                                
                            </div>
                            <p class="text-center">Already have account <a href="javascript:void(0)" (click)="formType='login'">Login</a></p>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
