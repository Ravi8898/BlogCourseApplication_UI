<div class="toast-content-success" *ngIf="successToast" [ngClass]="{'show-toast': successToast}">
    <div class="d-flex bd-toast">
        <div>
            <img alt="" src="../../../../assets/svg/Success.svg" />
        </div>
        <div class="toast-text">
            {{toastMsg}}
        </div>
        <button type="button" class="btn-close" (click)="successToast = false"></button>
    </div>
</div>

<div class="toast-content-error" *ngIf="errorToast" [ngClass]="{'show-toast': errorToast}">
    <div class="d-flex bd-toast">
        <div>
            <img alt="" src="../../../../assets/svg/Error.svg" />
        </div>
        <div class="toast-text">
            {{toastMsg}}
        </div>
        <button type="button" class="btn-close" (click)="errorToast = false; performAction(false)"></button>
    </div>
</div>
