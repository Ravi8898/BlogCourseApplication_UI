<app-popup-dialog [showPopup]="successPopup" [popupMessage]="popupMessage"></app-popup-dialog>

<div class="row">

    <div class="col-12">
        <div class="justify-content-between space-between-center project-label mb-2">
            <label>Compliance Category List</label>

            <button type="button" class="button-submit d-flex m-0" (click)="openComplianceModal()">
                <span class="insit-img"><img src="../../../assets/svg/add.svg"></span>
                <span style="margin-top: 10px;">Create</span>
            </button>

        </div>



        <app-simple-table [columns]="columns" [tableData]="complianceCategoryDetails" [isloading]="isLoader"
            (handleEdit)="onEdit($event)" (handleDelete)="onDelete($event)"></app-simple-table>
    </div>

</div>

<app-custom-modal *ngIf="complianceModal" (onClickCross)="closeComplianceModal()" class="currency-modal"
    [title]="'COMPLIANCE CATEGORY'">
    <form [formGroup]="complianceForm" class="custom-modal-content">
    <div class="row">
      <div class="col-12">
        <!-- Compliance Category ID -->
        <!-- <div class="form-group">
                  <label for="complianceID">Comp. Category ID <span class="asterisk">*</span></label>
                  <input type="text" class="form-control" id="complianceID" formControlName="complianceID"
                         maxlength="250" placeholder="Enter Compliance Category ID">
                  <div *ngIf="f['complianceID'].touched && f['complianceID'].invalid" class="text-danger">
                    <small *ngIf="f['complianceID'].errors?.['required']">Compliance Category ID is required.</small>
                    <small *ngIf="f['complianceID'].errors?.['maxlength']">Maximum length is 250 characters.</small>
                  </div>
                </div> -->
    
        <!-- Compliance Category Name -->
        <div class="form-group mt-2">
          <label for="complianceCategoryName">Compliance Category Name <span class="asterisk">*</span></label>
          <input type="text" class="form-control" id="complianceCategoryName" formControlName="complianceCategoryName"
            maxlength="60" placeholder="Enter Compliance Category Name">
          <div *ngIf="f['complianceCategoryName'].touched && f['complianceCategoryName'].invalid" class="text-danger">
            <small *ngIf="f['complianceCategoryName'].errors?.['required']">Compliance Category Name is required.</small>
            <small *ngIf="f['complianceCategoryName'].errors?.['maxlength']">Maximum length is 250 characters.</small>
          </div>
        </div>
    
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="d-flex mt-4">
          <button *ngIf="!isLoader" type="button" [disabled]="!isUpdated && isEdit" id="bt_approve"
            class="button-submit button-left" (click)="onSubmit()">
            <span class="ps-5"> {{isEdit ? 'Update':'Create'}}</span>
            <img alt="" src="../../../assets/svg/right-arrow.svg" style="margin-left: -33px" class="left-arrow" />
          </button>
          <button *ngIf="isLoader" id="bt_loader" class="button-submit m-0 pt-2" type="button" disabled>
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Loading...
          </button>
          <button type="button" id="bt_reject" class="button-back button-left"
            (click)="isEdit ? closeClauseModal() :resetForm()">
            <span class="ps-5">{{isEdit ? 'Cancel' :'Reset'}}</span>
            <img *ngIf="!isEdit" alt="" src="../../../assets/svg/reset.svg" class="left-arrow" />
            <img *ngIf="isEdit" style="margin-left: -31px" alt="" src="../../../assets/svg/reject.svg" class="left-arrow" />
          </button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="mt-4">
          <div class="text-danger" *ngIf="errorMessage != ''">{{errorMessage}}</div>
        </div>
      </div>
    </div>
    </form>
</app-custom-modal>
