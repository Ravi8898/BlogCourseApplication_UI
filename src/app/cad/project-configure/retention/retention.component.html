<app-popup-dialog [showPopup]="successPopup" [popupMessage]="popupMessage"></app-popup-dialog>

<div class="row">

    <div class="col-12">
        <div class="justify-content-between space-between-center project-label mb-2">
            <label>Retention List</label>

            <button type="button" class="button-submit d-flex m-0" (click)="openRetentionModal()">
                <span class="insit-img"><img src="../../../assets/svg/add.svg"></span>
                <span style="margin-top: 10px;">Create</span>
            </button>

        </div>



        <app-simple-table [columns]="columns" [tableData]="advanceTypeDetails" [isloading]="isLoader"
            (handleEdit)="onEdit($event)" (handleDelete)="onDelete($event)"></app-simple-table>
    </div>

</div>

<app-custom-modal *ngIf="retentionModal" class="retention-modal" (onClickCross)="closeRetentionModal()"
    [title]="'RETENTION'">
    <form [formGroup]="retentionForm" (ngSubmit)="saveData()">
        <div class="row">
            <div class="col-12">

                <div class="form-group mt-2">
                    <label for="retentionTypeName">Retention Type</label>
                    <label class="asterisk">*</label>
                    <input type="text" formControlName="retentionName" class="form-control" id="retentionTypeName"
                        maxlength="240" placeholder="Enter Retention Type" />
                    <span id="advanceTypeName_error" class="text-danger"
                        *ngIf="(retentionForm.get('retentionName')?.touched || submitted) && retentionForm.get('retentionName')?.errors?.['required']">
                        Retention Type is required
                    </span>
                </div>

                <div class="form-group mt-2">
                    <label for="retentionPercentage">Percentage (%)</label>
                    <label class="asterisk">*</label>
                    <input type="text" formControlName="retentionPercentage" class="form-control"
                        id="retentionPercentage" maxlength="6" placeholder="Enter Percentage" appOnlyDecimal />
                    <span id="advanceTypeName_error" class="text-danger"
                        *ngIf="(retentionForm.get('retentionPercentage')?.touched || submitted) && retentionForm.get('retentionPercentage')?.errors?.['required']">
                        Percentage is required
                    </span>
                </div>

            </div>
            <div class="row">
                <div class="col-12">
                    <div class="d-flex mt-4">
                        <button *ngIf="!isLoader" type="button" [disabled]="!isUpdated && isEdit" id="bt_approve"
                            class="button-submit button-left" (click)="saveData()">
                            <span class="ps-5"> {{isEdit ? 'Update':'Create'}}</span>
                            <img alt="" src="../../../assets/svg/right-arrow.svg" style="margin-left: -33px"
                                class="left-arrow" />
                        </button>
                        <button *ngIf="isLoader" id="bt_loader" class="button-submit m-0 pt-2" type="button" disabled>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                            Loading...
                        </button>
                        <button type="button" id="bt_reject" class="button-back button-left"
                            (click)="isEdit ? closeRetentionModal() :resetForm()">
                            <span class="ps-5">{{isEdit ? 'Cancel' :'Reset'}}</span>
                            <img *ngIf="!isEdit" alt="" src="../../../assets/svg/reset.svg" class="left-arrow" />
                            <img *ngIf="isEdit" style="margin-left: -31px" alt="" src="../../../assets/svg/reject.svg"
                                class="left-arrow" />
                        </button>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="mt-4">
                        <div class="text-danger" *ngIf="errorMessage != ''">{{errorMessage}}</div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</app-custom-modal>
