<app-popup-dialog [showPopup]="successPopup" [popupMessage]="popupMessage"></app-popup-dialog>

<div class="row">

    <div class="col-12">
        <div class="justify-content-between space-between-center project-label mb-2">
            <label>Advance Type List</label>

            <button type="button" class="button-submit d-flex m-0" (click)="openAdvanceModal()">
                <span class="insit-img"><img src="../../../assets/svg/add.svg"></span>
                <span style="margin-top: 10px;">Create</span>
            </button>

        </div>



        <app-simple-table [columns]="columns" [tableData]="advanceTypeDetails" [isloading]="isLoader"
            (handleEdit)="onEdit($event)" (handleView)="onView($event)"
            (handleDelete)="onDelete($event)"></app-simple-table>
    </div>

</div>

<app-custom-modal *ngIf="advanceTypeModal" class="advance-type-modal" (onClickCross)="closeAdvanceModal()" [title]="'ADVANCE TYPE'">
    <form [formGroup]="advanceTypeForm" (ngSubmit)="saveData()">
        <div class="row">
            <div class="col-12">
                <!-- <div class="form-group">
                    <label for="advanceID">Advance Type ID</label>
                    <label class="asterisk">*</label>
                    <input type="text" class="form-control" id="advanceID" maxlength="18"
                        placeholder="Enter Advance Type ID" (keypress)="allowOnlyNumbers($event)">
                </div> -->

                <div class="form-group mt-2">
                    <label for="advanceTypeName">Advance Type Name</label>
                    <label class="asterisk">*</label>
                    <input type="text" class="form-control" formControlName="advanceTypeName" id="advanceTypeName"
                        maxlength="100" placeholder="Enter Advance Type Name">
                    <span id="advanceTypeName_error" class="text-danger"
                        *ngIf="(advanceTypeForm.get('advanceTypeName')?.touched || submitted) && advanceTypeForm.get('advanceTypeName')?.errors?.['required']">
                        Currency Name is required
                    </span>
                </div>

                <div class="form-group mt-2">
                    <label for="remark">Remark</label>
                    <label class="asterisk">*</label>
                    <textarea type="text" [(ngModel)]="advance_remarks" formControlName="description"
                        class="form-control" id="remark" maxlength="250" rows="6" placeholder="Enter Remark"
                        (input)="updateCharCount_Advance()"></textarea>
                    <small>{{charCount_advance}} / 250</small>

                    <span id="advanceTypeName_error" class="text-danger"
                        *ngIf="(advanceTypeForm.get('description')?.touched || submitted) && advanceTypeForm.get('description')?.errors?.['required']">
                        Remark is required
                    </span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="d-flex mt-4">
                    <button *ngIf="!isLoader" type="button" [disabled]="!isUpdated && isEdit" id="bt_approve"
                        class="button-submit button-left" (click)="saveData()">
                        <span class="ps-5"> {{isEdit ? 'Update':'Create'}}</span>
                        <img alt="" src="../../../assets/svg/right-arrow.svg" style="margin-left: -33px" class="left-arrow" />
                    </button>
                    <button *ngIf="isLoader" id="bt_loader" class="button-submit m-0 pt-2" type="button" disabled>
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Loading...
                    </button>
                    <button type="button" id="bt_reject" class="button-back button-left"   (click)="isEdit ? closeAdvanceModal() :resetForm()">
                        <span class="ps-5">{{isEdit ? 'Cancel' :'Reset'}}</span>
                        <img *ngIf="!isEdit" alt="" src="../../../assets/svg/reset.svg" class="left-arrow" />
                        <img *ngIf="isEdit" style="margin-left: -31px" alt="" src="../../../assets/svg/reject.svg" class="left-arrow" />
                    </button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="mt-4">
                    <div class="text-danger" *ngIf="errorMessage != ''">{{errorMessage}}</div>
                </div>
            </div>
        </div>
    </form>
</app-custom-modal>

<app-custom-modal class="document-modal" title="DOCUMENTS" (onClickCross)="closedocumentsModal()"
    *ngIf="documentsModal">
    <form [formGroup]="documentsForm">
        <div class="row">
            <div class="col-12">
                <div class="form-group">
                    <label for="documentType">Document Type</label>
                    <label class="asterisk">*</label>
                    <ng-select formControlName="documentType" class="dropdown-list-autocomplete"
                        placeholder="Select Document Type">
                        <ng-option value="">Select Document Type</ng-option>
                        <ng-option *ngFor="let item of optionDocumentType" [value]="item.documentTypeId">
                            {{item.documentTypeName}}</ng-option>

                    </ng-select>
                    <span id="documentType_error" class="text-danger"
                        *ngIf="(documentsForm.get('documentType')?.touched || submitted) && documentsForm.get('documentType')?.errors?.['required']">
                        Document Type is required
                    </span>
                </div>

                <div class="form-group mt-2">
                    <label for="remark">Remark</label>
                    <label class="asterisk">*</label>
                    <textarea formControlName="remarkDoc" type="text" [(ngModel)]="document_remarks"
                        class="form-control" id="remark" maxlength="250" rows="6" placeholder="Enter Remark"
                        (input)="updateCharCount_Document()">

                    </textarea>
                    <small>{{charCount_document}} / 250</small>
                    <span id="remarkDoc_error" class="text-danger"
                        *ngIf="(documentsForm.get('remarkDoc')?.touched || submitted) && documentsForm.get('remarkDoc')?.errors?.['required']">
                        Remark is required
                    </span>
                </div>

                <!-- <div class="form-group mt-2">
                    <label>Options</label>
                    <label class="asterisk">*</label>
                    <div class="custom-toggle">
                        <span [class.active]="documentStatus === 'Activate'">Activate</span>
                        <input hidden type="checkbox" id="toggleStatus" (change)="toggleStatus()"
                            [checked]="documentStatus === 'Activate'" />
                        <label for="toggleStatus" class="toggle-switch"
                            [class.active]="documentStatus === 'Activate'"></label>
                        <span [class.active]="documentStatus === 'Deactivate'">Deactivate</span>
                    </div>
                </div> -->



            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="d-flex mt-4">

                    <button *ngIf="!isLoaderDoc" type="button" id="bt_approve_doc"
                    class="button-submit button-left" (click)="saveDocument()">
                    <span class="ps-5"> Submit</span>
                    <img alt="" src="../../../assets/svg/right-arrow.svg" style="margin-left: -33px" class="left-arrow" />
                </button>
                    <button *ngIf="isLoaderDoc" id="bt_loader_doc" class="button-submit m-0 pt-2" type="button" disabled>
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Loading...
                    </button>

                    <button type="button" id="bt_reject_doc" class="button-back button-left"   (click)="resetFormDoc()">
                        <span class="ps-5">Reset</span>
                        <img alt="" src="../../../assets/svg/reset.svg" class="left-arrow" />
                    </button>

                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="mt-4">
                    <div class="text-danger" *ngIf="errorMessage != ''">{{errorMessage}}</div>
                </div>
            </div>
        </div>
    </form>

    <hr />

    <label class="project-label" style="font-weight: 600;">DOCUMENT'S LIST</label>
    <app-simple-table [title]="'document'" [columns]="document_columns" [tableData]="documentDetails"
        [isloading]="isLoaderDoc" (handleEdit)="onEditDoc($event)"
        (deleteDocument)="deleteDoc($event)"></app-simple-table>
</app-custom-modal>

<div class="popup-backdrop" *ngIf="deletePopup">
    <div class="popup">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this item?</p>
        <div class="popup-actions">
            <button class="button-back" (click)="closeDelectPopup()">Cancel</button>
            <button class="button-submit" (click)="confirmDelete()">Delete</button>
        </div>
    </div>
</div>
