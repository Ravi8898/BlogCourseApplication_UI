<app-toast-message
  [successToast]="successToast"
  [errorToast]="errorToast"
  [toastMsg]="toastMsg"
></app-toast-message>

<div class="articles-wrapper">
  <div class="header">
    <h2>My Articles</h2>
    <button class="common-button" (click)="openAddArticlePanel()">
      + Add Article
    </button>
  </div>

  <!-- Loader -->
  <div class="loader" *ngIf="loading">Loading articles...</div>

  <!-- Table -->
  <div class="feature-card" *ngIf="!loading">
    <app-ad-table
      [tableData]="articleTableList"
      [isTableTile]="true"
      [isTableFilter]="true"
      [isSearchShow]="true"
      [searchObject]="articleSearchObject"
      [showHistory]="false"
      [showActionColumn]="showActionColumn"
      (searchParamObj)="applyArticleSearch($event)"
      (sendForApproval)="onSendForApproval($event)"
    >
    </app-ad-table>
  </div>
  <div class="actions-right">
    <button class="common-button" (click)="goToAllArticles()">
      View All Articles
    </button>
  </div>

  <app-custom-modal
    [title]="'Add Article'"
    *ngIf="showAddPanel"
    (onClickCross)="closeAddEditModal()"
    (closeModal)="closeAddEditModal()"
  >
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-body">
          <form (ngSubmit)="onSubmit(formRef)" #formRef="ngForm">
            <div class="col-lg-5 col-md-3 col-xs-2 w-100 mt-3 input-text-group">
              <label class="form-label m-0">Title</label>
              <span class="asterisk">*</span>
              <input
                type="text"
                [(ngModel)]="formData.title"
                name="title"
                placeholder="Enter Title"
                required
                class="form-control"
              />
            </div>
            <div class="col-lg-5 col-md-3 col-xs-2 w-100 mt-3 input-text-group">
              <label class="form-label m-0">Description</label>
              <span class="asterisk">*</span>
              <input
                type="text"
                [(ngModel)]="formData.description"
                name="description"
                placeholder="Enter Description"
                required
                class="form-control"
              />
            </div>
            
            <div class="col-lg-5 col-md-3 col-xs-2 w-100 mt-3 input-text-group section-box" *ngFor="let section of formData.sections; let i = index">

              <div>
                <label class="form-label m-0">Section Name</label>
                <span class="asterisk">*</span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter Section Name"
                  [(ngModel)]="section.key"
                  name="sectionKey{{i}}" required/>
              </div>
              <div>
                <label class="form-label m-0">Section Explaination</label>
                <span class="asterisk">*</span>
                <textarea
                  [(ngModel)]="section.explanation"
                  name="explanation{{i}}"
                  placeholder="Enter explanation"
                  class="text-textarea" required
                  rows="4">
                </textarea>
              </div>
              <div class="section-header">
                <!-- Action buttons -->
                <div class="section-actions">
                  <!-- Delete -->
                  <a 
                    href="javascript:void(0);" class="bt-action section-delete" data-bs-toggle="tooltip" title="Delete"
                    (click)="deleteSection(i)">
                    <img src="../../../assets/svg/Delete.svg" alt="" />
                  </a>

                </div>
              </div>

              <!-- Image Upload -->
              <input type="file" accept="image/*" (change)="uploadImage($event, i)" />
            </div>

            <button class="common-button" type="button" (click)="addSection()">+ Add Section</button>
            
            <div class="buttons">
              <div class="buttons mt-5">
                <button type="submit" (click)="createArticle($event)" [disabled]="formRef.invalid"
                  class="button-submit"> Submit
                </button>

                <button type="button" class="button-back" (click)="resetForm()">Reset
                </button>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </app-custom-modal>
</div>
