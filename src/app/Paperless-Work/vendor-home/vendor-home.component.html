<div class="row">
    <div class="col-12">
        <div class="row">

            <div class="bd-tab-content">
                <div class="bd-tab-content-inner mb-3">
                    <p class="page-heading">Welcome to vSPEED</p>
                    <!-- <button type="button" class="button-submit" data-bs-toggle="modal"
                        data-bs-target="#chooseModal">Upload Invoice</button> -->
                    <button type="button" class="button-submit" (click)="navigateToPurchase()">Upload Invoice</button>

                </div>
                <app-ad-table-ng [title]="'Invoice List'" [columns]="invioceList_columns" [tableData]="invoiceList"
                    (goToViewPage)="ViewInvoice($event)" (goToDocument)="VendorDocument($event)">
                </app-ad-table-ng>
            </div>

        </div>
    </div>
</div>


<app-custom-modal *ngIf="isAddHistoryModelOpen" (onClickCross)="closeHistoryModal()" [title]="'Tracking'"
    class="history-modal">
    <app-tracking-timeline [invoiceId]="InvoiceID"></app-tracking-timeline>
</app-custom-modal>
<!-- <app-custom-modal *ngIf="isAddDocumentModelOpen" (onClickCross)="closeDocumentModal()" [title]="'Document'"

    <img src="../../../assets/img/document.png" alt="">
</app-custom-modal> -->
<app-custom-modal *ngIf="isDocumentListModelOpen" (onClickCross)="closeDocumentListModal()" [title]="'Document'"
    class="credit-note-modal">
    <app-simple-table [tableData]="DocumentDetails" [isloading]="isLoader" [columns]="Documentcolumns"
        (handleClickHere)="onView($event)" (handleView)="onView($event)"></app-simple-table>
</app-custom-modal>
<app-custom-modal *ngIf="isAddDocumentModelOpen" (onClickCross)="closeDocumentModal()"
    (closeModal)="closeDocumentModal()" [title]="'Document'" class="history-modal">
    <div *ngIf="!isLoader">
        <ngx-extended-pdf-viewer [base64Src]="base64String" [textLayer]="true"></ngx-extended-pdf-viewer>
    </div>

    <div *ngIf="isLoader" class="text-center mt-5 mb-5">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Loading...
    </div>

</app-custom-modal>

<!-- Choose Modal -->
